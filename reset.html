<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Actualizando Forrajeria</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#e7f5ef;color:#123f45;font-family:Arial,sans-serif}
    main{max-width:420px;padding:24px;border:1px solid #9bcabe;background:white;border-radius:12px;text-align:center}
    b{display:block;font-size:22px;margin-bottom:8px}
  </style>
</head>
<body>
  <main>
    <b>Actualizando app</b>
    <p>Limpiando cache vieja y recargando...</p>
  </main>
  <script>
    (async function () {
      try {
        if ("serviceWorker" in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((registration) => registration.unregister()));
        }
        if (window.caches && caches.keys) {
          const keys = await caches.keys();
          await Promise.all(keys.map((key) => caches.delete(key)));
        }
      } catch (error) {}
      location.replace("/?fresh=" + Date.now());
    })();
  </script>
</body>
</html>
